<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Unity Игры</title>
    
    <!-- Вот эта строчка подключает иконку сайта -->
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }
        .logo {
            max-width: 100%;
            height: auto;
            margin-bottom: 40px;
            border-radius: 8px;
        }
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .btn {
            display: block;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            background-color: #383838;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s, transform 0.2s;
            border: 2px solid #555;
        }
        .btn:hover {
            background-color: #505050;
            transform: translateY(-2px);
        }
        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Логотип сайта -->
        <img src="res/logo1.png" alt="Logo" class="logo">

        <!-- Кнопки для перехода к играм -->
        <div class="button-container">
            <a href="phwad/index.html" class="btn">Психологический хоррор с собакой</a>
            <a href="sgsu/index.html" class="btn">SGSU</a>
        </div>
    </div>

</body>
</html>
